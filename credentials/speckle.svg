<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6BB6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BA8F5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3D4FCC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2937AA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Left face (dark blue) -->
  <polygon points="20,35 20,75 50,90 50,50" fill="url(#leftFace)"/>
  
  <!-- Right face (medium blue) -->
  <polygon points="50,50 50,90 80,75 80,35" fill="url(#rightFace)"/>
  
  <!-- Top face (light blue) -->
  <polygon points="20,35 50,20 80,35 50,50" fill="url(#topFace)"/>
</svg>
